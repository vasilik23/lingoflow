name: Production Smoke

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: false

jobs:
  public-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install --disable-pip-version-check -r requirements.lock
      - name: Check production public contracts
        run: >-
          python manage.py production_smoke
          https://lingoflow-learn.vercel.app
          --public-only
          --timeout 15
      - name: Explain failure response
        if: failure()
        run: |
          echo "### Production smoke failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Correlate the failed request ID with Vercel logs." >> "$GITHUB_STEP_SUMMARY"
          echo "GitHub Actions notifications are the current alert channel; external paging remains pending." >> "$GITHUB_STEP_SUMMARY"

  authenticated-contracts:
    if: vars.LINGOFLOW_AUTHENTICATED_SMOKE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-smoke
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install --disable-pip-version-check -r requirements.lock
      - name: Check dedicated learner contracts with a fresh session
        env:
          LINGOFLOW_SMOKE_AUTH_URL: ${{ secrets.LINGOFLOW_SMOKE_AUTH_URL }}
          LINGOFLOW_SMOKE_PUBLISHABLE_KEY: ${{ secrets.LINGOFLOW_SMOKE_PUBLISHABLE_KEY }}
          LINGOFLOW_SMOKE_EMAIL: ${{ secrets.LINGOFLOW_SMOKE_EMAIL }}
          LINGOFLOW_SMOKE_PASSWORD: ${{ secrets.LINGOFLOW_SMOKE_PASSWORD }}
          LINGOFLOW_SMOKE_USER_ID: ${{ secrets.LINGOFLOW_SMOKE_USER_ID }}
        run: >-
          python manage.py production_smoke
          https://lingoflow-learn.vercel.app
          --fresh-session --timeout 15
      - name: Explain authenticated failure
        if: failure()
        run: |
          echo "### Authenticated smoke failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Check dedicated account credentials, Auth limits and Vercel logs. No public-only fallback." >> "$GITHUB_STEP_SUMMARY"
          echo "GitHub Actions notifications are the current alert channel; external paging remains pending." >> "$GITHUB_STEP_SUMMARY"
