name: Python

on:
  pull_request:
    paths:
      - "backend/**"
      - "supabase/**"
      - ".github/workflows/python.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "supabase/**"
      - ".github/workflows/python.yml"

permissions:
  contents: read

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  beta-metrics-database:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable-ci-fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: disposable-ci-fixture
    steps:
      - uses: actions/checkout@v6
      - name: Verify isolated diagnostics schema and integrity
        run: >-
          psql -v ON_ERROR_STOP=1
          -f supabase/tests/beta_metrics_fixture.sql
          -f supabase/migrations/20261025083448_beta_metrics.sql
          -f supabase/tests/beta_metrics.sql
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install --disable-pip-version-check -r requirements.lock
      - run: python manage.py test
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
