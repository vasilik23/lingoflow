{% load static i18n ui %}
<!doctype html>
<html lang="{{ LANGUAGE_CODE }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#6d4aff">
    <title>{% translate "Нет подключения — PolskiFlow" %}</title>
    <link rel="icon" href="{% static 'polskiflow/favicon.svg' %}?shell={{ pwa_shell_version }}" type="image/svg+xml">
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #f7f6fb; color: #24212f; }
      main { width: min(34rem, calc(100% - 2rem)); box-sizing: border-box; padding: 2rem; border: 1px solid #ded9ee; border-radius: 1.5rem; background: #fff; box-shadow: 0 1rem 3rem rgb(35 25 65 / 10%); }
      img { width: 3.5rem; height: 3.5rem; }
      h1 { margin: 1rem 0 .5rem; font-size: clamp(1.6rem, 6vw, 2.25rem); }
      p { line-height: 1.6; }
      button { border: 0; border-radius: .8rem; padding: .8rem 1rem; background: #6d4aff; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
      @media (prefers-color-scheme: dark) { body { background: #151421; color: #f2efff; } main { background: #211f30; border-color: #3b3752; } }
    </style>
  </head>
  <body>
    <main>
      <img src="{% static 'polskiflow/favicon.svg' %}?shell={{ pwa_shell_version }}" alt="">
      <h1>{% translate "Сейчас нет подключения" %}</h1>
      <p>{% translate "Вернитесь в сеть и повторите попытку. PolskiFlow не сохраняет ответы и прогресс офлайн: безопасная синхронизация появится на следующем этапе." %}</p>
      <button type="button" onclick="window.location.reload()">{% translate "Попробовать снова" %}</button>
    </main>
  </body>
</html>
