{% load static i18n ui %}
<!doctype html>
<html lang="{{ LANGUAGE_CODE }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#F7F7F9">
    <script>
      (function () {
        const storageKey = "polskiflow-theme";
        const root = document.documentElement;
        const media = window.matchMedia("(prefers-color-scheme: dark)");

        function storedTheme() {
          try {
            const value = localStorage.getItem(storageKey);
            return value === "light" || value === "dark" ? value : "system";
          } catch (error) {
            return "system";
          }
        }

        function applyTheme(value) {
          const resolved = value === "system" ? (media.matches ? "dark" : "light") : value;
          root.dataset.theme = resolved;
          root.style.colorScheme = resolved;
          document.querySelector('meta[name="theme-color"]')?.setAttribute(
            "content", resolved === "dark" ? "#151518" : "#F7F7F9"
          );
        }

        applyTheme(storedTheme());
        media.addEventListener?.("change", function () {
          if (storedTheme() === "system") applyTheme("system");
        });
        window.PolskiFlowTheme = { applyTheme, storedTheme, storageKey, media };
      }());
    </script>
    <title>{% translate "Нет подключения — LingoFlow" %}</title>
    <link rel="icon" href="{% static 'polskiflow/favicon.svg' %}?shell={{ pwa_shell_version }}" type="image/svg+xml">
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; --bg: #F7F7F9; --surface: #FFFFFF; --text: #202024; --muted: #62626E; --primary-soft: #EEF2FF; --red: #B33D49; --line: #E2E2E8; --primary: #4F46E5; --on-action: #FFFFFF; }
      :root[data-theme="dark"] { color-scheme: dark; --bg: #151518; --surface: #202024; --text: #F1F1F4; --muted: #B0B0BD; --primary-soft: #2B2C48; --red: #FFABB3; --line: #393940; --primary: #A5B4FC; --on-action: #1B1740; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: var(--bg); color: var(--text); }
      main { width: min(34rem, calc(100% - 2rem)); box-sizing: border-box; padding: 2rem; border: 1px solid var(--line); border-radius: 1rem; background: var(--surface); box-shadow: none; }
      img { width: 3.5rem; height: 3.5rem; }
      h1 { margin: 1rem 0 .5rem; font-size: clamp(1.6rem, 6vw, 2.25rem); }
      p { line-height: 1.6; }
      button { border: 0; border-radius: .8rem; padding: .8rem 1rem; background: var(--primary); color: var(--on-action); font: inherit; font-weight: 700; cursor: pointer; }
      button:focus-visible { outline: 3px solid var(--primary); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="{% static 'polskiflow/favicon.svg' %}?shell={{ pwa_shell_version }}" alt="">
      <h1>{% translate "Сейчас нет подключения" %}</h1>
      <p>{% translate "Вернитесь в сеть и повторите попытку. LingoFlow не сохраняет ответы и прогресс офлайн: безопасная синхронизация появится на следующем этапе." %}</p>
      <button type="button" onclick="window.location.reload()">{% translate "Попробовать снова" %}</button>
    </main>
  </body>
</html>
