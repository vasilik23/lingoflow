[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "lingoflow"
version = "0.1.0"
description = "Python/Django implementation of LingoFlow"
requires-python = ">=3.11"
dependencies = [
  "certifi>=2026.7,<2027",
  "Django>=5.2,<5.3",
  "psycopg[binary]>=3.3,<3.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["polskiflow*"]
